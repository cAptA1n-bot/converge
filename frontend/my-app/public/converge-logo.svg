<svg width="168" height="40" viewBox="0 0 168 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Converge Primary Logo (Light Background) -->
  <defs>
    <linearGradient id="logo-grad-top" x1="4" y1="11" x2="28" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#125548" />
      <stop offset="100%" stop-color="#176B5B" />
    </linearGradient>
    <linearGradient id="logo-grad-bottom" x1="4" y1="29" x2="28" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#238F7A" />
      <stop offset="100%" stop-color="#176B5B" />
    </linearGradient>
  </defs>

  <!-- Symbol -->
  <g transform="translate(2, 0)">
    <!-- Top Path -->
    <path
      d="M 6 11.5 C 15 11.5 21 16 27 20 L 31.5 20"
      stroke="url(#logo-grad-top)"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bottom Path -->
    <path
      d="M 6 28.5 C 15 28.5 21 24 27 20 L 31.5 20"
      stroke="url(#logo-grad-bottom)"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Node -->
    <circle cx="27" cy="20" r="3" fill="#176B5B" />
    <circle cx="27" cy="20" r="1.4" fill="#DDF4E8" />
  </g>

  <!-- Wordmark: converge. -->
  <text
    x="44"
    y="27"
    fill="#17211F"
    font-family="system-ui, -apple-system, 'Geist', 'Segoe UI', Roboto, sans-serif"
    font-size="23"
    font-weight="750"
    letter-spacing="-0.04em"
  >converge<tspan fill="#176B5B">.</tspan></text>
</svg>

