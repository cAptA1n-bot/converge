  <!-- Bottom Path (Emerging Talent) -->
  <path
    d="M 8 28.5 C 17 28.5 23 24 29 20 L 33.5 20"
    stroke="url(#converge-grad-bottom)"
    stroke-width="4.5"
    stroke-linecap="round"
