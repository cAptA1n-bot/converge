<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Converge Symbol (Forest Green Mark) -->
  <defs>
    <linearGradient id="converge-grad-top" x1="8" y1="11" x2="33" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#125548" />
      <stop offset="100%" stop-color="#176B5B" />
    </linearGradient>
    <linearGradient id="converge-grad-bottom" x1="8" y1="29" x2="33" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#238F7A" />
      <stop offset="100%" stop-color="#176B5B" />
